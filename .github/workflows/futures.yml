name: futures-run

# The futures engine (v0.29): CME Globex daily bars for 39 futures markets from Databento (2010 to now, about a dollar
# or two; the run refuses a pull estimated above $5) and hedgers' positions from the CFTC. Weekly on Saturday and by
# hand. The pysystemtrade run (the long record to March 2024) needs no key and ships with the page.
on:
  schedule:
    - cron: "23 7 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        # v0.44.1: the same exact pins as CI and the daily run, so a new pandas cannot break the weekly job alone
        # v0.47: databento's own requirements pinned as well, to the versions the daily run of 2026-11-18 resolved (daily.yml)
        run: |
          pip install -r requirements.lock && pip install -e ".[dev]" --no-deps
          pip install "databento==0.88.0" "databento-dbn==0.70.0" "aiohttp==3.14.5" "aiohappyeyeballs==2.7.1" "aiosignal==1.4.0" \
            "attrs==26.1.0" "certifi==2026.10.23" "charset_normalizer==3.5.2" "frozenlist==1.8.0" "idna==3.20" "multidict==7.2.1" \
            "propcache==0.5.4" "requests==2.34.2" "typing_extensions==4.16.0" "urllib3==2.8.0" "yarl==1.25.1" "zstandard==0.25.0"

      - name: Futures engine (Databento bars and definitions, CFTC positions)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -z "$DATABENTO_API_KEY" ]; then
            echo "::notice::DATABENTO_API_KEY secret is not set; skipping the futures engine."
            exit 0
          fi
          python -m buildout futures --source databento --out site/data --cache .cache/futures

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/futures.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          msg="Futures engine $(date -u +%Y-%m-%d)"
          git commit -q -m "$msg"
          ours=$(git rev-parse HEAD)
          # v0.47: the same rule as the daily run. Nothing is merged: the one file this job writes is placed, whole, on
          # top of main as it is at that moment, so a push that landed meanwhile can neither conflict nor be undone.
          for i in 1 2 3 4; do
            git fetch -q origin main
            git checkout -q --detach origin/main
            git checkout -q "$ours" -- site/data/futures.json
            if git diff --cached --quiet; then
              echo "main already has these results."
              exit 0
            fi
            git commit -q -m "$msg"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error::could not push the results after four tries"
          exit 1
